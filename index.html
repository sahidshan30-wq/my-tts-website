<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Audio Premium Studio</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f3; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 480px; box-sizing: border-box; }
        h2 { text-align: center; color: #1e293b; margin-top: 0; }
        label { font-weight: 600; display: block; margin-top: 15px; margin-bottom: 5px; color: #475569; }
        input, textarea, button { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        button { background-color: #10b981; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #059669; }
        button:disabled { background-color: #94a3b8; }
        audio { width: 100%; margin-top: 20px; }
        .info-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 12px; border-radius: 8px; margin-top: 15px; display: none; text-align: center; }
        .error-msg { color: #dc2626; font-size: 14px; margin-top: 12px; font-weight: bold; text-align: center; background: #fef2f2; padding: 10px; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Fish Audio Studio</h2>
    
    <label>1. Fish Audio API Key:</label>
    <input type="password" id="apiKey" placeholder="अपनी Key पेस्ट करें">

    <label>2. Voice ID (Hindi Voice):</label>
    <input type="text" id="voiceId" value="6c3d7cfb3d1d44dba29160ef21a8bad6">

    <label>3. टेक्स्ट लिखें:</label>
    <textarea id="textInput" rows="4" placeholder="यहाँ टेक्स्ट लिखें..."></textarea>

    <button id="genBtn" onclick="generateSpeech()">Generate Audio</button>
    
    <div id="errorBox" class="error-msg"></div>
    
    <div id="successBox" class="info-box">
        🔊 ऑडियो तैयार है! यहाँ से सुनें:
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<script>
async function generateSpeech() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const text = document.getElementById('textInput').value.trim();
    const voiceId = document.getElementById('voiceId').value.trim();
    const button = document.getElementById('genBtn');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');

    errorBox.style.display = "none";
    successBox.style.display = "none";

    if (!apiKey || !text) {
        alert("कृपया API Key और Text दोनों भरें!");
        return;
    }

    button.innerText = "⏳ प्रोसेसिंग हो रही है...";
    button.disabled = true;

    // अलग-अलग प्रॉक्सी सर्वर का डायरेक्ट कॉम्बिनेशन
    const targetUrl = 'https://fish.audio';
    const proxy = 'https://allorigins.win';

    try {
        const response = await fetch(proxy + encodeURIComponent(targetUrl), {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                text: text,
                reference_id: voiceId,
                model: "s2.1-pro-free", 
                format: 'mp3'
            })
        });

        // स्टेटस चेकिंग
        if (response.status === 401) {
            throw new Error("आपकी API Key गलत है! कृपया सही Key डालें।");
        } else if (response.status === 402) {
            throw new Error("अकाउंट बैलेंस 0 है! आपके फ्री क्रेडिट्स समाप्त हो चुके हैं।");
        } else if (!response.ok) {
            throw new Error("सर्वर रिस्पॉन्स कोड: " + response.status);
        }

        const audioBlob = await response.blob();
        
        if (audioBlob.size < 500) {
            throw new Error("क्रेडिट खत्म या API ब्लॉक। कृपया एक बार नया अकाउंट बनाकर आज़माएं।");
        }

        const audioUrl = URL.createObjectURL(audioBlob);
        const player = document.getElementById('audioPlayer');
        player.src = audioUrl;
        
        successBox.style.display = 'block';
        player.play();

    } catch (error) {
        errorBox.innerText = "❌ " + error.message;
        errorBox.style.display = "block";
    } finally {
        button.innerText = "Generate Audio";
        button.disabled = false;
    }
}
</script>
</body>
</html>
