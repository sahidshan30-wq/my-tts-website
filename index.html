<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100% Working AI Text to Speech</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 480px; box-sizing: border-box; }
        h2 { text-align: center; color: #1e293b; margin-top: 0; font-size: 24px; }
        label { font-weight: 600; display: block; margin-top: 20px; margin-bottom: 6px; color: #475569; }
        input, textarea, button { width: 100%; padding: 14px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; font-size: 15px; }
        input:focus, textarea:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        button { background-color: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }
        audio { width: 100%; margin-top: 20px; border-radius: 8px; }
        .success-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 12px; border-radius: 8px; margin-top: 15px; display: none; font-size: 14px; text-align: center; font-weight: 500; }
        .error-msg { color: #dc2626; font-size: 14px; margin-top: 12px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Voice Converter</h2>
    
    <label>1. Fish Audio API Key डालें:</label>
    <input type="password" id="apiKey" placeholder="यहाँ अपनी Key पेस्ट करें (Bearer...)">

    <label>2. Voice ID (Hindi Voice सेट है):</label>
    <input type="text" id="voiceId" value="6c3d7cfb3d1d44dba29160ef21a8bad6">

    <label>3. अपना टेक्स्ट (Text) लिखें:</label>
    <textarea id="textInput" rows="4" placeholder="यहाँ जो भी लिखेंगे, AI उसे जादुई आवाज़ में बदल देगा..."></textarea>

    <button id="genBtn" onclick="generateSpeech()">Convert Text to Speech</button>
    
    <div id="errorBox" class="error-msg"></div>
    
    <div id="successContainer" class="success-box">
        🎉 आपकी आवाज़ तैयार है! नीचे से सुनें:
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<script>
async function generateSpeech() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const text = document.getElementById('textInput').value.trim();
    const voiceId = document.getElementById('voiceId').value.trim();
    const button = document.getElementById('genBtn');
    const errorBox = document.getElementById('errorBox');
    const successContainer = document.getElementById('successContainer');

    // स्क्रीन साफ करें
    errorBox.innerText = "";
    successContainer.style.display = "none";

    if (!apiKey) {
        alert("कृपया अपनी Fish Audio API Key बॉक्स नंबर 1 में डालें!");
        return;
    }
    if (!text) {
        alert("कृपया बॉक्स नंबर 3 में कोई टेक्स्ट लिखें जिसे आवाज़ में बदलना है!");
        return;
    }

    button.innerText = "⏳ आवाज़ बन रही है... थोड़ा इंतज़ार करें...";
    button.disabled = true;

    // ब्राउज़र का 'Failed to Fetch' एरर रोकने के लिए दो अलग-अलग सिक्योर प्रॉक्सी का बैकअप सेटअप
    const proxies = [
        'https://corsproxy.io?',
        'https://allorigins.win'
    ];
    
    const targetUrl = 'https://fish.audio';
    let response = null;
    let success = false;

    // प्रॉक्सी 1 से कोशिश करें, अगर फेल हुआ तो प्रॉक्सी 2 का इस्तेमाल करें
    for (let i = 0; i < proxies.length; i++) {
        try {
            const finalUrl = proxies[i] + encodeURIComponent(targetUrl);
            
            response = await fetch(finalUrl, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    text: text,
                    reference_id: voiceId,
                    model: "s2.1-pro-free", // मुफ्त मॉडल का उपयोग ताकि आपके क्रेडिट न खत्म हों
                    format: 'mp3'
                })
            });

            if (response.ok) {
                success = true;
                break; // अगर काम कर गया तो लूप से बाहर निकलें
            }
        } catch (e) {
            console.log("Proxy " + (i+1) + " failed, trying next...");
        }
    }

    // फाइनल चेकिंग और ऑडियो प्लेयर लोड करना
    if (success && response) {
        try {
            const audioBlob = await response.blob();
            if (audioBlob.size < 100) {
                throw new Error("API Key गलत है या आपके अकाउंट का फ्री कोटा समाप्त हो गया है।");
            }
            const audioUrl = URL.createObjectURL(audioBlob);
            
            const player = document.getElementById('audioPlayer');
            player.src = audioUrl;
            successContainer.style.display = 'block';
            player.play();
        } catch (error) {
            errorBox.innerText = "❌ एरर: " + error.message;
        }
    } else {
        errorBox.innerText = "❌ कनेक्शन फेल: कृपया अपनी API Key जांचें या इंटरनेट कनेक्शन चेक करें।";
    }

    button.innerText = "Convert Text to Speech";
    button.disabled = false;
}
</script>
</body>
</html>
