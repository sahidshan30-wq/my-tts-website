<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Audio Fixed TTS Studio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin-top: 50px; }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        input, textarea, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background-color: #2563eb; color: white; font-size: 16px; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1d4ed8; }
        audio { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Fish Audio Voice Studio</h2>
    
    <label>1. अपनी Fish Audio API Key डालें:</label>
    <input type="password" id="apiKey" placeholder="यहाँ अपनी Key पेस्ट करें">

    <label>2. Voice ID (Hindi Voice):</label>
    <input type="text" id="voiceId" value="6c3d7cfb3d1d44dba29160ef21a8bad6">

    <label>3. अपना टेक्स्ट लिखें:</label>
    <textarea id="textInput" rows="4" placeholder="यहाँ जो लिखेंगे वो आवाज़ में बदल जाएगा..."></textarea>

    <button onclick="generateSpeech()">Generate Audio</button>

    <div id="audioContainer" style="display:none;">
        <label>आपका ऑडियो तैयार है:</label>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<script>
async function generateSpeech() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const text = document.getElementById('textInput').value.trim();
    const voiceId = document.getElementById('voiceId').value.trim();
    const button = document.querySelector('button');

    if (!apiKey || !text) {
        alert("कृपया API Key और Text दोनों भरें!");
        return;
    }

    button.innerText = "Processing... Wait...";
    button.disabled = true;

    try {
        const response = await fetch('https://api.fish.audio/v1/tts', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                text: text,
                reference_id: voiceId,
                model: "s2.1-pro-free", // मुफ्त मॉडल का उपयोग ताकि क्रेडिट न कटे
                format: 'mp3'
            })
        });

        if (!response.ok) {
            const errData = await response.text();
            throw new Error(errData);
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        
        const player = document.getElementById('audioPlayer');
        player.src = audioUrl;
        document.getElementById('audioContainer').style.display = 'block';
        player.play();

    } catch (error) {
        alert("Error: " + error.message);
    } finally {
        button.innerText = "Generate Audio";
        button.disabled = false;
    }
}
</script>
</body>
</html>
